definitions:
  env: &env
    flutter: stable
    xcode: latest
    java: 17
  verify: &verify
    name: Verify package and pinned artifacts
    script: |
      dart pub get
      dart analyze
      dart run tool/verify_artifacts.dart
      dart run tool/update_browser_corpus_manifest.dart --check
      dart test

workflows:
  android-build:
    name: Android native-assets build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment: *env
    triggering:
      events: [push]
    scripts:
      - *verify
      - name: Build Android app bundle
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > example/android/local.properties
          cd example
          flutter pub get
          flutter build appbundle --release

  ios-build:
    name: iOS native-assets build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment: *env
    triggering:
      events: [push]
    scripts:
      - *verify
      - name: Build iOS device and simulator
        script: |
          cd example
          flutter pub get
          flutter build ios --release --no-codesign
          flutter build ios --simulator --debug

  macos-build:
    name: macOS native-assets build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment: *env
    triggering:
      events: [push]
    scripts:
      - name: Run authoritative conformance gate
        script: tool/test_all.sh
      - name: Build macOS
        script: |
          cd example
          flutter pub get
          flutter build macos --release

  linux-build:
    name: Linux native-assets build
    instance_type: linux_x2
    max_build_duration: 20
    environment: *env
    triggering:
      events: [push]
    scripts:
      - name: Install native-assets linker
        script: |
          sudo apt-get update
          sudo apt-get install -y lld
      - *verify
      - name: Build Linux
        script: |
          cd example
          flutter pub get
          flutter build linux --release

  web-build:
    name: Flutter web Worker/Wasm build
    instance_type: linux_x2
    max_build_duration: 20
    environment: *env
    triggering:
      events: [push]
    scripts:
      - name: Test browser backend and build web example
        script: |
          tool/test_all.sh
          cd example
          flutter pub get
          flutter build web
          test -f build/web/assets/packages/image_ffmpeg/web/image_ffmpeg_worker.mjs
          test -f build/web/assets/packages/image_ffmpeg/web/image_ffmpeg_loader.mjs
          test -f build/web/assets/packages/image_ffmpeg/web/image_ffmpeg_module.mjs
          test -f build/web/assets/packages/image_ffmpeg/web/image_ffmpeg_module.wasm

  windows-build:
    name: Windows native-assets build
    instance_type: windows_x2
    max_build_duration: 20
    environment: *env
    triggering:
      events: [push]
    scripts:
      - *verify
      - name: Build Windows
        script: |
          cd example
          flutter pub get
          flutter build windows --release
