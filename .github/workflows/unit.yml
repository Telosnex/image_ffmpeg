name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@2b3e8c2aeffd68d7aeb371c35e58699357aefffc # v0.5.25
      - uses: Telosnex/telosnex_ci_tools/actions/lint@2b3e8c2aeffd68d7aeb371c35e58699357aefffc # v0.5.25
      - run: dart pub get --no-example
      - run: dart format --output=none --set-exit-if-changed lib test tool
      # The package: the example is a Flutter app (dart pub get --no-example).
      - run: dart analyze --fatal-infos lib test tool
      - run: dart run tool/verify_artifacts.dart
      # Authenticated: anonymous GitHub API calls share a small rate limit.
      - run: dart run kiln:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: dart run tool/update_browser_corpus_manifest.dart --check
      - run: dart test -r expanded
