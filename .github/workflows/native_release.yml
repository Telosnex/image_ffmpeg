# Builds the native library for every target and publishes the files as a
# GitHub release (fllama ADR 005 D5, D6, D8). Start it with
#   git push -f origin HEAD:native-release       (release)
#   git push -f origin HEAD:native-release-dry   (build only, no upload)
# or with workflow_dispatch. On success it pushes the branch
# native-manifest/<tag> with native_artifacts/prebuilt.json. Merge that
# branch to use the release.
#
# Linux and Windows libraries build in pinned Debian containers, as before
# (tool/build_native_*_docker.sh use the same images): Linux for glibc 2.31,
# Windows with MinGW-w64 GCC (x64) and llvm-mingw (arm64).
name: native release
run-name: Native release / ${{ (github.ref_name == 'native-release-dry' || inputs.dry_run) && 'build only' || 'publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, upload nothing.
        type: boolean
        default: false
  push:
    branches: [native-release, native-release-dry]

concurrency:
  group: native-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DART_VERSION: 3.13.1
  NDK_VERSION: 28.2.13676358
  # Flutter passes iOS 13 to build hooks (flutter_tools targetIOSVersion).
  IOS_VERSION: 13
  MACOS_VERSION: 12

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15 }
          - { target: ios-arm64-iphoneos, runner: macos-15 }
          - { target: ios-arm64-iphonesimulator, runner: macos-15 }
          - { target: ios-x64-iphonesimulator, runner: macos-15 }
          - { target: android-arm, runner: ubuntu-22.04 }
          - { target: android-arm64, runner: ubuntu-22.04 }
          - { target: android-x64, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Install the NDK
        if: startsWith(matrix.target, 'android-')
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Describe the toolchain
        id: toolchain
        run: |
          case "${{ matrix.target }}" in
            android-*) t="Android NDK $NDK_VERSION" ;;
            macos-*|ios-*) t="$(xcodebuild -version | sed -n 1p), $(xcrun clang --version | sed -n 1p)" ;;
          esac
          echo "Toolchain: $t"
          echo "value=$t" >> "$GITHUB_OUTPUT"

      # example/ is a Flutter app.
      - &pub_get
        run: dart pub get --no-example

      # Files go to $RUNNER_TEMP: untracked files in the checkout count in
      # the source key.
      - &paths
        name: Set paths
        run: echo "OUT=$RUNNER_TEMP/native" >> "$GITHUB_ENV"

      - &clean
        name: Check that the work tree is clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::Untracked or changed files would change the source key."
            exit 1
          fi

      - &key
        name: Source key
        run: |
          mkdir -p "$OUT/key"
          dart run native_prebuilt:key --list > "$OUT/key/${{ matrix.target }}.txt"
          tail -1 "$OUT/key/${{ matrix.target }}.txt"

      - &build
        name: Build
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.value }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          dart run native_prebuilt:build \
            --target "${{ matrix.target }}" \
            --out "$OUT/out/${{ matrix.target }}" \
            --runner "$RUNNER_LABEL" \
            --toolchain "$TOOLCHAIN" \
            --ios-version "$IOS_VERSION" \
            --macos-version "$MACOS_VERSION"
          cat "$OUT/out/${{ matrix.target }}/target.json"

      - name: ABI boundary test
        if: matrix.target == 'macos-arm64'
        run: |
          lib="$OUT/out/${{ matrix.target }}/libimage_ffmpeg.dylib"
          xcrun --sdk macosx clang -std=c11 -O2 -Wall -Wextra -Werror \
            -arch arm64 -mmacosx-version-min="$MACOS_VERSION" -Isrc \
            tool/support/abi_boundary_test.c "$lib" \
            -Wl,-rpath,"$(dirname "$lib")" -o "$RUNNER_TEMP/abi_boundary_test"
          "$RUNNER_TEMP/abi_boundary_test" --quick

      - *clean

      - &upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 90

  build-in-container:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            image: debian:bullseye-slim@sha256:cba95a21c96c1f5fc2470081829363eed57706634f7dc26e8c6712934303d57a
            runner: ubuntu-22.04, Debian 11 container
          - target: linux-arm64
            image: debian:bullseye-slim@sha256:cba95a21c96c1f5fc2470081829363eed57706634f7dc26e8c6712934303d57a
            runner: ubuntu-22.04, Debian 11 container
          - target: windows-x64
            image: debian:bullseye-slim@sha256:cba95a21c96c1f5fc2470081829363eed57706634f7dc26e8c6712934303d57a
            runner: ubuntu-22.04, Debian 11 container
          # debian:bookworm-slim, linux/amd64 manifest of index
          # sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241.
          - target: windows-arm64
            image: debian@sha256:362e64223cc0da95422b3b13c045186fc0a81250e765d31c025fbddf257f6143
            runner: ubuntu-22.04, Debian 12 container
    steps:
      # actions/checkout needs git in the container for a git work tree.
      # Debian 11 packages are on archive.debian.org, as in
      # tool/install_build_toolchain.sh.
      - name: Install git
        run: |
          if grep -q '^VERSION_CODENAME=bullseye$' /etc/os-release; then
            printf 'deb http://archive.debian.org/debian %s main\n' bullseye bullseye-updates > /etc/apt/sources.list
            echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list
          fi
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates git > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install the toolchain
        run: |
          tool/install_build_toolchain.sh "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == windows-arm64 ]]; then
            echo /opt/llvm-mingw/bin >> "$GITHUB_PATH"
          fi
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Describe the toolchain
        id: toolchain
        run: |
          debian="Debian $(cat /etc/debian_version)"
          case "${{ matrix.target }}" in
            linux-x64) t="$debian, $(gcc --version | sed -n 1p)" ;;
            linux-arm64) t="$debian, $(aarch64-linux-gnu-gcc --version | sed -n 1p)" ;;
            windows-x64) t="$debian, $(x86_64-w64-mingw32-gcc --version | sed -n 1p)" ;;
            windows-arm64) t="$debian, llvm-mingw 20260922, $(aarch64-w64-mingw32-clang --version | sed -n 1p)" ;;
          esac
          echo "Toolchain: $t"
          echo "value=$t" >> "$GITHUB_OUTPUT"

      - *pub_get
      - *paths
      - *clean
      - *key
      - *build

      - name: ABI boundary test
        if: matrix.target == 'linux-x64'
        run: |
          dir="$OUT/out/${{ matrix.target }}"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            tool/support/abi_boundary_test.c -L"$dir" -limage_ffmpeg \
            -pthread -Wl,-rpath,"$dir" -o "$RUNNER_TEMP/abi_boundary_test"
          "$RUNNER_TEMP/abi_boundary_test" --quick
          # The newest glibc symbol version the library needs (glibc 2.31).
          objdump -T "$dir/libimage_ffmpeg.so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - *clean
      - *upload

  release:
    needs: [build, build-in-container]
    # Only the owner publishes, from this repository.
    if: >-
      github.repository == 'Telosnex/image_ffmpeg' &&
      github.actor == 'jpohhhh' && github.triggering_actor == 'jpohhhh'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.ref_name == 'native-release-dry' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: dart pub get --no-example
      - run: echo "ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Compare the source keys of all runners (I2)
        run: |
          dart run native_prebuilt:key --list > "$RUNNER_TEMP/local-key.txt"
          status=0
          for f in "$ARTIFACTS"/key/*.txt; do
            if ! diff -u "$RUNNER_TEMP/local-key.txt" "$f"; then
              echo "::error::The source key on $(basename "$f" .txt) differs."
              status=1
            fi
          done
          exit $status

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--staging "$RUNNER_TEMP/staging")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          dart run native_prebuilt:release "${args[@]}" "$ARTIFACTS/out"
          cat native_artifacts/prebuilt.json

      - name: Push the manifest branch
        if: env.DRY_RUN != 'true'
        run: |
          tag="native-$(dart run native_prebuilt:key | tail -1 | cut -c1-16)"
          branch="native-manifest/$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add native_artifacts/prebuilt.json
          git commit -m "native: prebuilt files of release $tag"
          git push origin "$branch"
          {
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo
            echo "Merge branch \`$branch\` to use it."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-manifest
          path: native_artifacts/prebuilt.json
