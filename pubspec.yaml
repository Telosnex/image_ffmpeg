name: image_ffmpeg
description: Pinned cross-platform FFmpeg image decoding and encoding through native FFI and WebAssembly.
version: 0.0.1
homepage: https://telosnex.com
publish_to: none

environment:
  sdk: ^3.12.2

topics:
  - ffmpeg
  - ffi
  - webassembly
  - native-assets

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ">=1.0.0 <3.0.0"
  native_prebuilt:
    git:
      url: https://github.com/Telosnex/native_prebuilt.git
      ref: e995f4073e335ef57051ac930d05b6c5926fc44a

dev_dependencies:
  ffigen: ^20.1.1
  image: ^4.5.4
  lints: ^6.0.0
  test: ^1.28.0

# Ship the Worker, ABI adapter, and Emscripten module/Wasm with Flutter web
# apps that depend on this package. Flutter serves these at
# assets/packages/image_ffmpeg/web/ inside the built web app, which is the
# default location loaded by lib/src/backend/backend_web.dart. Non-Flutter
# embedders serve lib/web/ themselves and override FfmpegWeb.workerUri.
flutter:
  assets:
    - path: packages/image_ffmpeg/web/image_ffmpeg_worker.mjs
      platforms: [web]
    - path: packages/image_ffmpeg/web/image_ffmpeg_loader.mjs
      platforms: [web]
    - path: packages/image_ffmpeg/web/image_ffmpeg_module.mjs
      platforms: [web]
    - path: packages/image_ffmpeg/web/image_ffmpeg_module.wasm
      platforms: [web]
