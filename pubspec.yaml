name: image_ffmpeg
description: >-
  Image decoding and encoding with a pinned FFmpeg build, the same on every
  platform. Native through FFI, web through WebAssembly.
version: 0.1.0
repository: https://github.com/Telosnex/image_ffmpeg
issue_tracker: https://github.com/Telosnex/image_ffmpeg/issues

environment:
  sdk: ^3.12.2

topics:
  - ffmpeg
  - ffi
  - webassembly
  - native-assets

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ">=1.0.0 <3.0.0"
  kiln: ^0.1.1

dev_dependencies:
  ffigen: ^20.1.1
  image: ^4.5.4
  lints: ^6.0.0
  test: ^1.28.0
